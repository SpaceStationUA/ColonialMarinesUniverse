author: TheHellFireo
changes:
  - type: Add
    message: "Додано медичну основу, керовану ранами: типи ран за механізмом, ліміти здоров'я кінцівок, контроль кровотечі та детальний огляд травм."
  - type: Add
    message: Додано польове змішування марлі та травматичних пов'язок із новими медичними інгредієнтами й спрайтами лікування.
  - type: Tweak
    message: Оновлено аналізатори здоров'я, перебіг хірургії, медичні вендори, вендори спорядження стрільця та медичні закупівлі ASRS під нову систему ран.
  - type: Fix
    message: Виправлено хірургічні лінії, синтетичні трансплантати, застряглі уламки та взаємодії травматичного стабілізатора з новими правилами ран і відновлення кінцівок.
