#-- Pets --
# TODO: Add a way to pat and pick up pets. Obfuscate names for xenos to refer to them as fuzzies/pets.
- type: entity
  parent: RMCSimpleMob
  id: RMCMobCorgi
  name: "коргі"
  description: "Це коргі."
  abstract: true
  components:
  - type: Butcherable
    spawned:
    - id: FoodMeat
      amount: 2
  - type: ReplacementAccent
    accent: dog
  - type: Speech
    speechVerb: Canine
    speechSounds: Dog
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 150
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobThresholds
    thresholds:
      0: Alive
      15: Critical
      20: Dead
  - type: Grammar
    attributes:
      gender: epicene
  - type: FixedIdentity
    name: cm-chatsan-replacement-dogs

- type: entity
  parent: RMCMobCorgi
  id: CMMobWiggles
  name: "Містер Віґлс"
  description: "Це цуценя коргі. МІСТЕР ВІҐЛС!! ВІН НАЙКРАЩИЙ!"
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Pets/corgi.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: puppy
  - type: DamageStateVisuals
    states:
      Alive:
        Base: puppy
      Critical:
        Base: puppy_dead
      Dead:
        Base: puppy_dead
  - type: Item
    size: Normal
    sprite: _RMC14/Mobs/Animals/corgi.rsi
    heldPrefix: puppy
  - type: Clothing
    quickEquip: false
    sprite: _RMC14/Mobs/Animals/corgi.rsi
    equippedPrefix: puppy
    slots:
    - HEAD
  - type: WarpPoint
    follow: true
    location: Mister Wiggles


- type: entity
  parent: RMCSimpleMob
  id: RMCMobCat
  name: "кіт"
  description: "Це чорний кіт"
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Pets/cat.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: cat
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 115
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: DamageStateVisuals
    states:
      Alive:
        Base: cat
      Critical:
        Base: cat_dead
      Dead:
        Base: cat_dead
  - type: Item
    size: Normal
    sprite: _RMC14/Mobs/Animals/cat.rsi
    heldPrefix: cat1
  - type: Clothing
    quickEquip: false
    sprite: _RMC14/Mobs/Animals/cat.rsi
    equippedPrefix: cat1
    slots:
    - HEAD
  - type: Speech
    speechSounds: Cat
    speechVerb: SmallMob
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Effects/bite.ogg
    angle: 0
    animation: WeaponArcBite
    damage:
      types:
        blunt: 25
  - type: MobThresholds
    thresholds:
      0: Alive
      15: Critical
      20: Dead
  - type: ReplacementAccent
    accent: cat
  - type: Grammar
    attributes:
      gender: epicene
  - type: FixedIdentity
    name: cm-chatsan-replacement-cat

- type: entity
  parent: RMCMobCat
  id: RMCMobCatCalico
  name: "каліко"
  description: "Це рудий, коричневий і чорний кіт"
  components:
  - type: Sprite
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: cat2
  - type: DamageStateVisuals
    states:
      Alive:
        Base: cat2
      Critical:
        Base: cat2_dead
      Dead:
        Base: cat2_dead
  - type: Item
    size: Normal
    sprite: _RMC14/Mobs/Animals/cat.rsi
    heldPrefix: cat2
  - type: Clothing
    quickEquip: false
    sprite: _RMC14/Mobs/Animals/cat.rsi
    equippedPrefix: cat2
    slots:
    - HEAD

- type: entity
  parent: RMCMobCatCalico
  id: CMMobJones
  name: "Джонс"
  description: "Жорсткий старий безпритульний, чиєї походження ніхто, здається, не знає."
  components:
  - type: MobThresholds
    thresholds:
      0: Alive
      45: Critical
      50: Dead # A TOUGH old stray, yes this is parity reasoning
  - type: Grammar
    attributes:
      proper: true
      gender: male
  - type: WarpPoint
    follow: true
    location: Jones

- type: entity
  parent: RMCMobCatCalico
  id: RMCMobOrion
  name: "Оріон"
  description: "Свійський улюбленець-кіт. На нашийнику написано «Оріон»."
  components:
  - type: WarpPoint
    follow: true
    location: Orion

- type: entity
  parent: RMCMobCat
  id: RMCMobGarry
  name: "Ґаррі"
  description: "Її хутро на вигляд і на дотик, як оксамит, а її хвіст час від часу здригається."
  components:
  - type: Grammar
    attributes:
      proper: true
      gender: female
  - type: WarpPoint
    follow: true
    location: Garry

