- type: entity
  abstract: true
  parent: RMCBaseUniformAccessory
  id: RMCPonchoBase
  name: "пончо"
  description: "Абстрактне пончо."
  components:
  - type: UniformAccessory
    category: Poncho
    limit: 1
    hiddenByJacketRolling: false
    layerKey: "enum.UniformAccessoryLayer.Base"
  - type: Item
    size: Normal

- type: entity
  parent: RMCPonchoBase
  id: RMCPoncho
  name: "пончо ОНМК"
  description: "Стандартне пончо ОНМК має варіанти для кожного клімату. Індивідуально підігнане для кріплення до стандартних варіантів броні ОНМК і носіння поверх уніформи, воно зручне, зігріває або охолоджує за потреби та добре сидить. Морпіх кращого й не просив би. Лагідно зветься «вубі»."
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Accessory/Ponchos/classic.rsi
    state: icon
  - type: UniformAccessory
    playerSprite:
      sprite: _RMC14/Objects/Clothing/Accessory/Ponchos/classic.rsi
      state: poncho

