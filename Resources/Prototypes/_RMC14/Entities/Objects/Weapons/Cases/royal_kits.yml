- type: entity
  parent: CMSniperEquipmentCase
  id: RMCScoutSniperSniperEquipmentCase
  name: "кейс зі спорядженням розвідника-снайпера"
  description: "A large case containing an M96S-B suppressed scoped rifle, its corresponding head-mounted sight, six spare magazines of standard ammo, and a bipod. \n\nNOTE: You cannot put items back inside this case."
  suffix: Sniper
  components:
  - type: Sprite
    sprite: _RMC14/Objects/loadout_kits.rsi
    layers:
    - state: closed
      map: [ base ]
    - state: sniper
      map: [ label ]
  - type: Icon
    sprite: _RMC14/Objects/loadout_kits.rsi
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        base:
          True: { state: open }
          False: { state: closed }
        label:
          True: { visible: false }
          False: { visible: true }
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,17,1
  - type: StorageFill
    contents:
    - id: RMCVisorNightVision
    - id: CMMagazineSniperM96S
      amount: 6
    - id: RMCM96SBSniperRifle
    - id: RMCAttachmentBipod
  - type: CMChangeUserOnVend
    addComponents:
    - type: SniperWhitelist

- type: entity
  parent: CMSniperEquipmentCase
  id: RMCScoutSniperMarksmanEquipmentCase
  name: "кейс зі спорядженням розвідника-снайпера"
  description: "Великий кейс із гвинтівкою призначеного снайпера L112A1, відповідним наголівним прицілом, десятьма запасними магазинами набоїв із плоскою головкою та сошками."
  suffix: Marksman
  components:
  - type: Sprite
    sprite: _RMC14/Objects/loadout_kits.rsi
    layers:
    - state: closed
      map: [ base ]
    - state: sniper
      map: [ label ]
  - type: Icon
    sprite: _RMC14/Objects/loadout_kits.rsi
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        base:
          True: { state: open }
          False: { state: closed }
        label:
          True: { visible: false }
          False: { visible: true }
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,25,1
  - type: IgnoreContentsSize
    items:
      tags:
      - RMCL112SniperRifle
  - type: StorageFill
    contents:
    - id: RMCVisorNightVision
    - id: RMCL112SniperRifleSuppressedSH
    - id: RMCMagazineSniperL112SH
      amount: 10
    - id: RMCAttachmentBipod
  - type: CMChangeUserOnVend
    addComponents:
    - type: SniperWhitelist

# L49 assault shotgun
- type: entity
  parent: RMCGunCaseBase
  id: RMCL49Case
  name: "кейс штурмової рушниці L49"
  suffix: PVE, RCM
  description: "Збройовий кейс із штурмовою рушницею L49. Містить зброю L49, дві коробки пробивних набоїв L49B і патронташ для рушничних набоїв зразка L28."
  components:
  - type: Storage
    maxItemSize: Ginormous
    grid:
    - 0,0,7,1 # 4 slots
    whitelist:
      tags:
      - RMCWeaponShotgunL49
      - RMCBoxShotgunL49B
      - RMCL49Holster
  - type: StorageFill
    contents:
    - id: RMCWeaponShotgunL49
    - id: RMCBeltL49
    - id: RMCBoxShotgunL49B
      amount: 2
