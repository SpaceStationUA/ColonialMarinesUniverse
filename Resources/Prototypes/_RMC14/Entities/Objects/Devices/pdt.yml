- type: entity
  parent: [ BaseItem, PowerCellSlotSmallItem ]
  id: RMCPDTLocatorTube
  name: "пошукова трубка PDT/L"
  description: "Ручна пошукова трубка, спарена з наручним браслетом PDT. Вона показує напрямок і відстань до свого браслета-партнера."
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Devices/pdt_locator_tube.rsi
    layers:
    - state: icon
    - state: screen
      shader: unshaded
      visible: false
      map: [ "enum.PDTLocatorVisualLayers.Screen" ]
    - state: unlinked
      shader: unshaded
      visible: false
      map: [ "enum.PDTLocatorVisualLayers.Bracelet" ]
  - type: Item
    size: Small
  - type: Tag
    tags:
    - PDTLocator
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PDTLocatorVisuals.Screen:
        enum.PDTLocatorVisualLayers.Screen:
          Off: { visible: false }
          Normal: { state: screen, visible: true }
          Yellow: { state: screen-yellow, visible: true }
          Red: { state: screen-red, visible: true }
      enum.PDTLocatorVisuals.Bracelet:
        enum.PDTLocatorVisualLayers.Bracelet:
          Hidden: { visible: false }
          Linked: { state: linked, visible: true }
          Unlinked: { state: unlinked, visible: true }
  - type: PDTLocator
  - type: UseDelay
    delay: 1
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: RMCPowerCellCrap

- type: entity
  parent: RMCWatchBaseL
  id: RMCPDTBracelet
  name: "наручний браслет PDT"
  description: "Наручний браслет персонального передавача даних, призначений для спарювання з пошуковою трубкою PDT/L."
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Accessory/Watches/pdt.rsi
    layers:
    - state: icon
      map: [ "base" ]
  - type: RandomSprite
    available:
    - base:
        icon: ""
        icon-1: ""
        icon-2: ""
  - type: UniformAccessory
    playerSprite:
      sprite: _RMC14/Objects/Clothing/Accessory/Watches/pdt.rsi
      state: watchL
  - type: Clothing
    sprite: _RMC14/Objects/Clothing/Accessory/Watches/pdt.rsi
    slots:
    - GLOVES
  - type: PDTBracelet

- type: entity
  parent: RMCWatchCase
  id: CMSparePDTLBattleBuddyKit
  name: "набір бойового побратима «Бутс!» PDT/L"
  description: "Невеликий міцний кейс із пошуковою трубкою PDT/L, спареним із нею наручним браслетом PDT і запасною мінібатарейкою Ве-Я."
  components:
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,5,1
    whitelist:
      tags:
      - PDTLocator
      - Watch
      - PowerCell
  - type: StorageFill
    contents:
    - id: RMCPDTLocatorTube
    - id: RMCPDTBracelet
    - id: RMCPowerCellCrap
  - type: PDTKit

- type: Tag
  id: PDTLocator
