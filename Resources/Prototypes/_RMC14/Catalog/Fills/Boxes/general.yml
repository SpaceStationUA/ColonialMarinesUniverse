- type: entity
  name: "коробка"
  parent: BoxBase
  id: RMCBoxCardboard
  description: "Це звичайна коробка."
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Storage/boxes.rsi
    state: box
  - type: Item
    sprite: _RMC14/Objects/Storage/boxes.rsi
    size: Large
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,13,1
  - type: Tag
    tags:
    - RMCBoxStorage
  - type: PhysicalComposition
    materialComposition:
      RMCSheetCardboard: 3750
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno

- type: entity
  parent: RMCBoxCardboard
  id: RMCBoxPrescriptionGlasses
  name: "коробка рецептурних окулярів"
  description: "У цій коробці лежать окуляри для ботанів."
  components:
  - type: Storage
    whitelist:
      tags:
      - RMCPrescriptionGlasses
  - type: StorageFill
    contents:
    - id: RMCGlassesMarineRpg
      amount: 7
  - type: Sprite
    state: glasses

- type: entity
  parent: RMCBoxCardboard
  id: RMCBoxCompanyCaps
  name: "коробка бейсболок Компанії"
  description: "У цій коробці сім фірмових бейсболок марки «Вестон-Ямада». Роздавайте їх на власний розсуд."
  components:
  - type: Storage
    whitelist:
      tags:
      - ClothMade
  - type: StorageFill
    contents:
    - id: RMCHeadCapWestonYamadaDark
      amount: 6

- type: entity
  parent: RMCBoxCardboard
  id: RMCBoxDrinkingGlasses
  name: "коробка склянок"
  description: "На ній зображені склянки для напоїв."
  components:
  - type: Storage
    whitelist:
      tags:
      - DrinkGlass
  - type: StorageFill
    contents:
    - id: RMCDrinkGlass
      amount: 6

- type: entity
  parent: RMCBoxCardboard
  id: RMCBoxPaperCups
  name: "коробка паперових стаканчиків"
  description: "На ній зображені паперові стаканчики."
  components:
  - type: Storage
    whitelist:
      tags:
      - DrinkGlass
  - type: StorageFill
    contents:
    - id: RMCPaperCup
      amount: 7

- type: entity
  parent: RMCBoxCardboard
  id: RMCBoxMousetraps
  name: "мишоловки «Пест-Бі-Гон»"
  description: "ПОПЕРЕДЖЕННЯ: Тримайте подалі від дітей."
  components:
  - type: Storage
    whitelist:
      components:
      - Mousetrap
  - type: StorageFill
    contents:
    - id: Mousetrap
      amount: 6

- type: entity
  parent: RMCBoxCardboard
  id: RMCBoxInflatableWallsSmall
  name: "коробка надувних бар'єрів"
  description: "Містить надувні стіни та двері."
  suffix: Small
  components:
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,3,1 # 2 slots
    whitelist:
      tags:
      - RMCInflatableBarrier
  - type: FixedItemSizeStorage
  - type: IgnoreContentsSize
    items:
      tags:
      - RMCInflatableBarrier
  - type: StorageFill
    contents:
    - id: RMCInflatableDoorFolded1
      amount: 3
    - id: RMCInflatableWallFolded1
      amount: 4
  - type: Sprite
    state: inf_box
  - type: Item
    size: Normal

- type: entity
  parent: RMCBoxInflatableWallsSmall
  id: RMCBoxInflatableWallsNormal
  suffix: Normal
  components:
  - type: Item
    size: Large

- type: Tag
  id: RMCBoxStorage
