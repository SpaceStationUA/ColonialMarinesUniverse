- type: job
  parent: AU14JobLEOBase
  id: AU14DrugSmugglerJob
  name: "Контрабандист наркотиків"
  description: "Ви ледь утекли, коли КБМ накрило вашу стару нарколабораторію; на щастя, вам вдалося забрати частину товару, і вони не дізналися вашого імені. Час спробувати знову."
  setPreference: false
  startingGear: AU14DrugSmugglerGear
  icon: "CMJobIconEmpty"
  hasIcon: false
  requireAdminNotify: false
  joinNotifyCrew: false
  supervisors: au14-job-supervisors-loners
  accessGroups:
  - Colonist
  roleWeight: 0.25
  ranks:
    RMCRankCivilian: []
  special:
  - !type:AddComponentSpecial
    components:
    - type: Skills
      skills:
        RMCSkillFireman: 1
        RMCSkillVehicles: 1
        RMCSkillDomestics: 1
        RMCSkillFirearms: 2
    - type: EquipEntityPreset
      preset: AU14DrugSmugglerPreset
    - type: JobPrefix
      prefix: au14-job-prefix-mobboss
    - type: TacticalMapIcon
      icon:
        sprite: /Textures/_RMC14/Interface/map_blips.rsi
        state: synth
  hidden: false

- type: entity
  parent: AU14BaseMobSpeciesOrganicMisc
  id: AU14DrugSmuggler
  name: "Наркоторговець (злочинець)"
  components:
  - type: GhostTakeoverAvailable
  - type: GhostRoleApplySpecial
  - type: GhostRole
    makeSentient: true
    allowSpeech: true
    allowMovement: true
    name: "Наркоторговець (злочинець)"
    description: "Ви ледь утекли, коли КБМ накрило вашу стару нарколабораторію; на щастя, вам вдалося забрати частину товару, і вони не дізналися вашого імені. Час спробувати знову."
    reregister: false
    job: AU14DrugSmugglerJob
    raffle:
      settings: short
    rules: You do not know what is going on in the colony.

- type: startingGear
  id: AU14DrugSmugglerGear
  equipment:
    jumpsuit: CMJumpsuitLiaisonCharcoal
    shoes: RMCShoesLaceup
    id: AU14IDCardMobGoon
    ears: AU14HeadsetMob

- type: entity
  id: AU14DrugSmugglerPreset
  name: "пресет контрабандиста наркотиків"
  categories: [ HideSpawnMenu ]
  components:
  - type: EntityPreset
    randomGearOther:
    -
      - [ AU14SatchelFilledDrugs ]
      - [ AU14SatchelFilledDrugsAlt]

- type: entity
  parent: CMSatchel
  id: AU14SatchelFilledDrugs
  components:
  - type: StorageFill
    contents:
    - id: JointRainbow
      amount: 4
    - id: PillSpaceDrugs
      amount: 3
    - id: StrangePill
      amount: 3

- type: entity
  parent: CMSatchel
  id: AU14SatchelFilledDrugsAlt
  components:
  - type: StorageFill
    contents:
    - id: Joint
      amount: 4
    - id: StrangePill
      amount: 3
    - id: RMCSyringeDrugs
      amount: 1
