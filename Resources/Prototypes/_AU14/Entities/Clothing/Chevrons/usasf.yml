# base
- type: entity
  parent: RMCArmbandBase
  id: AU14ChevronUSASFBase
  abstract: true
  suffix: USASF Chevron
  description: "Знак розрізнення звань рядового й сержантського складу Аерокосмічних сил Сполучених Штатів. Цей знак змушує вас почуватися комфортно, наче під час польотних обідів з омарами та в сатинових кріокапсулах."

