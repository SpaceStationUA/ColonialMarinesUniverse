# base
- type: entity
  parent: RMCArmbandBase
  id: AU14ChevronVASCBase
  abstract: true
  suffix: VAI Chevron
  description: "Відзнака звання приватної військової компанії ВАІ. Агент з адаптації сказав, що ви радше сядете на неї, ніж носитимете, з огляду на всю таємну хрінь, якою ви займаєтеся."

