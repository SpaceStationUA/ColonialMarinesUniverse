# base
- type: entity
  parent: RMCArmbandBase
  id: AU14ChevronWeYuBase
  abstract: true
  suffix: WeYu Chevron
  description: "Знак розрізнення звань приватної військової компанії Вей-Ю. Коли ви його носите, здається, що ви маєте владу зробити будь-що, якщо спершу прочитали службову записку."

