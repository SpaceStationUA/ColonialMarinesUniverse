# base
- type: entity
  parent: RMCArmbandBase
  id: AU14ChevronRMCBase
  abstract: true
  suffix: RMC Chevron
  description: "Відзнака звання Королівської морської піхоти. Значок морпіха, здатного діяти в будь-якому екстремальному середовищі. Шкода, що більшу частину кар'єри ви проведете на кораблях."

