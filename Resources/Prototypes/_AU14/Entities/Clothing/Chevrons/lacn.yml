# base
- type: entity
  parent: RMCArmbandBase
  id: AU14ChevronLACNBase
  abstract: true
  suffix: LACN Chevron
  description: "Відзнака військово-морського звання ЛАКН. Значок залишає зелену пляму на лацкані, але пасує до уніформи латинських командос, тому його досі не переробили."

