- type: entity
  parent: RMCArmbandBase
  id: AU14ChevronUPPNIBase
  abstract: true
  suffix: Naval Infantry Chevron
  description: "Шеврон морської піхоти Союзу Прогресивних Народів. Коли ви його носите, ви відчуваєте гордість від того, що отримуєте додаткові пайки порівняно з пролетарями."

