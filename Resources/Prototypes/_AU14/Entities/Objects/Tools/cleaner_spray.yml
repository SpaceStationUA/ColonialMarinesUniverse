- type: entity
  parent: SprayBottleSpaceCleaner
  id: AU14SprayCleaner
  name: "спрей-очисник"
  description: "Пляшка-розпилювач, наповнена очищувальним розчином. Використовується для очищення різних поверхонь і предметів."
  components:
  - type: Sprite
    sprite: _AU14/Objects/Tools/cleaner_spray.rsi
    state: cleaner
  - type: Item
    sprite: _AU14/Objects/Tools/cleaner_spray.rsi

- type: entity
  parent: AU14SprayCleaner
  id: AU14SprayCleanerBig
  name: "великий спрей-очисник"
  description: "Велика пляшка-розпилювач, наповнена очищувальним розчином. Використовується для очищення різних поверхонь і предметів."
  components:
  - type: Sprite
    sprite: _AU14/Objects/Tools/cleaner_spray.rsi
    state: cleaner_large
  - type: SolutionContainerManager
    solutions:
      spray:
        maxVol: 300
        reagents:
        - ReagentId: SpaceCleaner
          Quantity: 300

- type: entity
  parent: AU14SprayCleaner
  id: AU14SprayCleanerExperimental
  name: "експериментальний спрей-очисник"
  description: "Експериментальна пляшка-розпилювач, наповнена очищувальним розчином. Здатна самостійно відновлювати очищувальний розчин, збираючи леткі сполуки з навколишньої атмосфери. Використовується для очищення різних поверхонь і предметів."
  components:
  - type: Sprite
    sprite: _AU14/Objects/Tools/cleaner_spray.rsi
    state: cleaner_special
  - type: SolutionContainerManager
    solutions:
      spray:
        maxVol: 300
        reagents:
        - ReagentId: SpaceCleaner
          Quantity: 300
  - type: SolutionRegeneration
    solution: spray
    generated:
      reagents:
      - ReagentId: SpaceCleaner
        Quantity: 1
