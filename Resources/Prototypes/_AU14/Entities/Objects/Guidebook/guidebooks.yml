# LAWS (marine)
- type: entity
  parent: RMCGuidebookBase
  id: AU14GuidebookLawMarine
  name: "уніфікований кодекс військової юстиції"
  description: "Зазвичай улюблене читання будь-якого члена військової поліції, адже весь його сенс - бути терезами для меча правосуддя, який несуть на борту суден багатьох військових сил, щоб підтримувати мир і порядок. Серед його прізвиськ, але не тільки: Червона книга диявола, Біблія всіх грішників, Та сама Книга, UCMJ, Червона цеглина, Посібник з тортур, Червона диявольська біблія всіх грішників."
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/Books/Other/marine_law.rsi
  - type: GuideHelp
    guides:
    - AU14UCMJ

# LAWS (colonial)
- type: entity
  parent: RMCGuidebookBase
  id: AU14GuidebookLawColonial
  name: "колоніальний цивільний кодекс"
  description: "Товстий, зачитаний і пошарпаний том із печаткою Орбітального суду та Колоніальної адміністрації. Історичне перше видання Колоніального цивільного кодексу, надруковане задовго до останніх реформ. Його сторінки вважаються застарілими, повними прецедентів, які сучасні юристи оскаржують сумнівними правовими аргументами, та положень, що ніколи не оновлювалися. Жодні два юристи не можуть погодитися, що насправді означає половина тексту, але кожен колоніальний офіс, здається, має примірник, і він досі перебуває в обігу як нагадування, що право - жива річ. Його лагідно називають 'Синя книга'."
  components:
  - type: Sprite
    sprite: _AU14/Objects/Misc/Books/cclaw.rsi
  - type: GuideHelp
    guides:
    - AU14CCLaw

