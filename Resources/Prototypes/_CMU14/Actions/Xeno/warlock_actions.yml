- type: entity
  parent: ActionXenoBase
  id: CMUActionXenoPsychicCrush
  name: "Психічне розчавлення"
  description: "Сконцентрувати психічний тиск у точці, а потім розчавити ворогів у зоні, що розширюється."
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _CMU14/Actions/Xeno/warlock.rsi
      state: psy_crush
    iconOn:
      sprite: _CMU14/Actions/Xeno/warlock.rsi
      state: psy_crush_activate
    useDelay: 0.25
  - type: TargetAction
    range: 7
    checkCanAccess: true
  - type: WorldTargetAction
    event: !type:CMUXenoPsychicCrushActionEvent
  - type: ActionBlockIfResting
  - type: RMCDazeableAction

- type: entity
  parent: ActionXenoBase
  id: CMUActionXenoPsychicBlast
  name: "Психічний вибух"
  description: "Підірвати психічну силу в точці, завдаючи шкоди й сповільнюючи ворогів поблизу."
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _CMU14/Actions/Xeno/warlock.rsi
      state: psy_blast
    useDelay: 8
  - type: TargetAction
    range: 7
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:CMUXenoPsychicBlastActionEvent
  - type: ActionBlockIfResting
  - type: RMCDazeableAction

- type: entity
  parent: ActionXenoBase
  id: CMUActionXenoPsychicShield
  name: "Психічний щит"
  description: "Підняти перед собою психічний щит, який ловить снаряди й може бути підірваний."
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _CMU14/Actions/Xeno/warlock.rsi
      state: psy_shield
    iconOn:
      sprite: _CMU14/Actions/Xeno/warlock.rsi
      state: psy_shield_reflect
    useDelay: 0.25
  - type: InstantAction
    event: !type:CMUXenoPsychicShieldActionEvent
  - type: ActionBlockIfResting
  - type: RMCDazeableAction
