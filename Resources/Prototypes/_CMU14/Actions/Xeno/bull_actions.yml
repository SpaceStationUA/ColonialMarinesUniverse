- type: entity
  parent: ActionXenoBase
  id: CMUActionXenoBullPlow
  name: "Прорив"
  description: "Налаштувати ривок так, щоб прориватися крізь цілі без зупинки."
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _CMU14/Actions/Xeno/bull.rsi
      state: bull_charge
    iconOn:
      sprite: _CMU14/Actions/Xeno/bull.rsi
      state: bull_ready_charge
    useDelay: 0.25
  - type: InstantAction
    event: !type:CMUXenoBullChargeActionEvent { mode: Plow }

- type: entity
  parent: ActionXenoBase
  id: CMUActionXenoBullHeadbutt
  name: "Удар головою"
  description: "Налаштувати ривок так, щоб відкинути ціль убік і завершити натиск."
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _CMU14/Actions/Xeno/bull.rsi
      state: bull_headbutt
    iconOn:
      sprite: _CMU14/Actions/Xeno/bull.rsi
      state: bull_headbutt
    useDelay: 0.25
  - type: InstantAction
    event: !type:CMUXenoBullChargeActionEvent { mode: Headbutt }

- type: entity
  parent: ActionXenoBase
  id: CMUActionXenoBullGore
  name: "Прокол"
  description: "Налаштувати ривок так, щоб проколоти ціль, завдавши більшої шкоди, і завершити натиск."
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _CMU14/Actions/Xeno/bull.rsi
      state: bull_gore
    iconOn:
      sprite: _CMU14/Actions/Xeno/bull.rsi
      state: bull_gore
    useDelay: 0.25
  - type: InstantAction
    event: !type:CMUXenoBullChargeActionEvent { mode: Gore }
