- type: entity
  parent: RMCUtilityBase
  id: CMUTraumaGovernorAttachment
  name: "травматичний стабілізатор"
  description: "Компактний аварійний стабілізатор, встановлений на броню, який може підтримати один ушкоджений орган достатньо довго для відходу."
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medical/stethoscope.rsi
    state: icon
  - type: UniformAccessory
    category: Utility
    limit: 1
    hidden: true
    playerSprite:
      sprite: _RMC14/Objects/Medical/stethoscope.rsi
      state: icon
  - type: CMUTraumaGovernorAttachment

- type: entity
  parent: BaseItem
  id: CMUTraumaGovernorVial
  name: "флакон обходу стабілізатора"
  description: "Запечатаний флакон каталізатора для одноразового обходу перезарядки травматичного стабілізатора."
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _RMC14/Objects/Chemistry/vials.rsi
    layers:
    - state: vial
    - state: vial1
    - state: vial-lid
  - type: CMUTraumaGovernorVial

- type: entity
  id: CMUActionTraumaGovernor
  name: "Активувати травматичний стабілізатор"
  description: "Оберіть орган для тимчасової стабілізації."
  components:
  - type: Action
    itemIconStyle: BigItem
    icon:
      sprite: _RMC14/Objects/Medical/stethoscope.rsi
      state: icon
  - type: InstantAction
    event: !type:CMUTraumaGovernorActionEvent
