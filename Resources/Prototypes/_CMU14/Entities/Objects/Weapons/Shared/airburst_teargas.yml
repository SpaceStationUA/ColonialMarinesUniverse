- type: entity
  parent: RMCBaseAirBurstGrenade
  id: CM14AirBurstTearGas
  name: "граната зі сльозогінним газом M74 AGM-PDC"
  description: "M74 - Airburst Grenade Munition - Personnel Denial Canister. Цю гранату потрібно запускати з гранатомета; вона детонує, коли досягає пункту призначення. Вона випускає хмару подразнювального газу з тимчасовими нейром’язовими ефектами."
  components:
  - type: Sprite
    sprite:  _CMU14/Objects/Weapons/Guns/Ammunition/teargascanister.rsi
    layers:
    - state: grenade_teargas
  - type: Tag
    tags:
    - Grenade
    - LauncherCompatibleGrenade
    - RMCAirburstGrenade
    - RMCGrenadeAGMF
  - type: ContainerContainer
    containers:
      cluster-payload: !type:Container
  - type: TriggerOnFixedDistanceStop
    delay: 1
  - type: CartridgeAmmo
    deleteOnSpawn: true
    proto: CMU14AirBurstProjectileTearGas

- type: entity
  parent: RMCBaseAirBurstProjectile
  id: CMU14AirBurstProjectileTearGas
  name: "граната зі сльозогінним газом M74 AGM-PDC"
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _CMU14/Objects/Weapons/Guns/Ammunition/teargascanister.rsi
    layers:
    - state: grenade_teargas_active
  - type: SpawnOnTerminate
    spawn: CMU14InstantTearGas
    projectileAdjust: false
  - type: SoundOnTrigger
    sound: /Audio/Effects/smoke.ogg
  - type: DeleteOnTrigger